{% extends 'base.html' %}
{% block content %}

    <h1>Homework Calendar</h1>

    <div id="calendar" style="max-width: 100%; margin: 20px 0;"></div>

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.9.0/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.9.0/main.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            try {
                var calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    height: '100%',
                    expandRows: true,
                    contentHeight: 'auto',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek,timeGridDay'
                    },
                    events: [
                        {% for homework in homeworks %}
                            {
                                title: '{{ homework.title|escapejs }}',
                                start: '{{ homework.assigned_date|date:"Y-m-d" }}',
                                end: '{{ homework.due_date|date:"Y-m-d" }}',
                                backgroundColor: '{{ homework.color }}',
                                textColor: 'white',
                                extendedProps: {
                                    subject: '{{ homework.subject.name|default:"No subject"|escapejs }}',
                                    description: '{{ homework.description|truncatewords:10|escapejs }}'
                                },
                                display: 'block'
                            },
                        {% endfor %}
                    ],
                    eventContent: function (arg) {
                        return {
                            html: `<div class="fc-event-title-container">
                        <strong>${arg.event.extendedProps.subject}</strong><br>
                        ${arg.event.title}
                       </div>`
                        };
                    },
                    editable: false,
                    aspectRatio: 1.35,
                });
            } catch (e) {
                console.error('calendar init error', e);
            }

            calendar.render();
        });
    </script>


{% endblock %}
