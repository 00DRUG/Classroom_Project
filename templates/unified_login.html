{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unified Login</title>
    <link rel="stylesheet" type="text/css" href="{% static 'styles/login.css' %}">
    <script>
        function setRole(role) {
            document.getElementById('role').value = role;
            document.getElementById('student-btn').classList.toggle('active', role === 'student');
            document.getElementById('teacher-btn').classList.toggle('active', role === 'teacher');
        }
        
        function validateForm(event) {
            const role = document.getElementById('role').value;
            if (!role) {
                alert("Please choose a role: Student or Teacher.");
                event.preventDefault();
                return false;
            }
            return true;  
        }
        function toggleRegisterForm() {
            const role = document.getElementById('role').value;
            if (!role) {
                alert("Please choose a role first.");
                return;
            }
            document.getElementById('register-role').value = role;
            document.getElementById('register-form').style.display = 'block';
        }
    </script>
</head>
<body>
<input type="hidden" name="next" value="{{ next }}">

    <div class="container">
        <h1>Login</h1>


        <div class="toggle-role">
            <button type="button" id="student-btn" onclick="setRole('student')">Student</button>
            <button type="button" id="teacher-btn" onclick="setRole('teacher')">Teacher</button>
        </div>

        <form method="post" onsubmit="return validateForm(event)">
            {% csrf_token %}
            <input type="hidden" name="role" id="role" value="">
            <input type="hidden" name="action" value="login">


            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                <label class="form-check-label" for="remember_me">Remember Me</label>
            </div>


            <button type="submit">Login</button>
            <button type="register" onclick="toggleRegisterForm()" >Register</button>
        </form>
        <div id="register-form" style="display: none; margin-top: 20px;">
    <h1>Register</h1>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="register">
        <input type="text" name="username" placeholder="Username" required>
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="last_name" placeholder="Last Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password1" placeholder="Password" required>
        <input type="password" name="password2" placeholder="Confirm Password" required>
        <input type="hidden" name="role" id="register-role">
        <button type="submit">Submit Registration</button>
    </form>
        </div>
        {% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

    </div>
</body>
</html>
